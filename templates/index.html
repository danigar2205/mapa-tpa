<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de Autobuses - Tiempo Real</title>
  
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* Pantalla de Selección de Menú */
    #pantalla-inicio {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }

    .menu-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .menu-header i {
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .menu-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .menu-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .lista-botones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 8px;
    }

    .lista-botones::-webkit-scrollbar {
      width: 6px;
    }
    .lista-botones::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .lista-botones::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .btn-menu {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      background: var(--bus-color, #2563eb);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      text-align: left;
    }

    .btn-menu:hover:not(.btn-deshabilitado) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-menu:active:not(.btn-deshabilitado) {
      transform: translateY(0);
    }

    .btn-title {
      font-weight: 800;
      font-size: 1.05rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .btn-subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .btn-deshabilitado {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-deshabilitado .btn-title {
      background: rgba(255, 255, 255, 0.06);
      color: #64748b;
    }

    .btn-deshabilitado .btn-subtitle {
      color: #64748b;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    .header-card {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 20px;
      color: #ffffff;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .line-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 6px 16px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .badge-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .badge-text p {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #4ade80;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse-green 1.8s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .info-value {
      font-size: 0.88rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 2px;
      word-break: break-word;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.75rem;
      color: #64748b;
    }

    .btn-action {
      background: #2563eb;
      color: white;
      border: none;
      min-height: 34px;
      min-width: 0;
      padding: 7px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.76rem;
      line-height: 1;
      white-space: nowrap;
      box-sizing: border-box;
      flex: 0 0 auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      transform: none;
    }

    .btn-action:hover,
    .btn-action:focus,
    .btn-action:active {
      transform: none;
    }
    .btn-action:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    .btn-menu-back {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-menu-back:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .bus-marker-container {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bus-marker-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--bus-color, rgba(37, 99, 235, 0.4));
      border-radius: 50%;
      animation: bus-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes bus-ping {
      75%, 100% { transform: scale(1.6); opacity: 0; }
    }

    .bus-marker-icon {
      position: relative;
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 3px solid #ffffff;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      font-size: 16px;
    }

    .occ-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .occ-green { background: #dcfce7; color: #15803d; }
    .occ-yellow { background: #fef9c3; color: #a16207; }
    .occ-orange { background: #ffedd5; color: #c2410c; }
    .occ-red { background: #fee2e2; color: #b91c1c; }
    .occ-gray { background: #f1f5f9; color: #64748b; }
    .btn-layer { background: rgba(255,255,255,.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,.15); min-width: 78px; }
    .btn-layer.active { background: rgba(37,99,235,.24); border-color: rgba(96,165,250,.7); color: #bfdbfe; }
    .footer-actions { display: flex; align-items: center; justify-content: flex-start; gap: 8px; flex-wrap: nowrap; }
    .footer-actions .btn-menu-back { margin-right: auto; }
    @media (max-width: 480px) {
      .footer-actions { gap: 5px; }
      .btn-action { min-height: 32px; padding: 6px 8px; font-size: .7rem; gap: 4px; }
      .btn-layer { min-width: 70px; }
    }
    .leaflet-tooltip.stop-label { border: 0; border-radius: 6px; padding: 4px 7px; color: #0f172a; font-size: 11px; font-weight: 700; box-shadow: 0 2px 8px rgba(15,23,42,.18); }

    .stop-popup { min-width: 230px; color: #0f172a; }
    .stop-popup-title { display: block; font-size: 14px; line-height: 1.35; margin-bottom: 8px; }
    .stop-popup-label { display: block; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin: 9px 0 5px; }
    .stop-line-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .stop-line-badge { display: inline-flex; align-items: center; border-radius: 6px; padding: 4px 7px; color: #fff; font-size: 10px; font-weight: 800; }
    .stop-arrivals { border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 2px; }
    .stop-arrival-row { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 7px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
    .stop-arrival-line { font-size: 10px; font-weight: 800; }
    .stop-arrival-destination { font-size: 11px; line-height: 1.25; color: #475569; }
    .stop-arrival-time { text-align: right; white-space: nowrap; }
    .stop-arrival-time strong { display: block; font-size: 14px; color: #0f172a; }
    .stop-arrival-time small { display: block; font-size: 10px; color: #2563eb; font-weight: 700; }
    .stop-arrival-source { display: inline-block; margin-top: 5px; color: #15803d; font-size: 10px; font-weight: 700; }
    .stop-arrival-state { color: #64748b; font-size: 11px; line-height: 1.4; padding: 8px 0; }
    .stop-arrival-updated { color: #94a3b8; font-size: 9px; padding-top: 6px; }
    @media (max-width: 480px) {
      .header-card { padding: 12px; }
      .footer-actions { gap: 5px; flex-wrap: nowrap; }
      .btn-action { padding: 6px 8px; font-size: .7rem; }
    }
  </style>
</head>
<body>

  <!-- Pantalla de Inicio / Selección de Línea -->
  <div id="pantalla-inicio">
    <div class="menu-card">
      <div class="menu-header">
        <i class="fa-solid fa-bus-simple"></i>
        <h1>Líneas en Tiempo Real</h1>
        <p>Selecciona una línea para abrir el mapa</p>
      </div>

      <div class="lista-botones">
        <button class="btn-menu btn-deshabilitado" disabled>
          <span class="btn-title">T01</span>

        </button>

        <button class="btn-menu btn-deshabilitado" disabled>

        <button class="btn-menu" onclick="iniciarMapa('T05')">

        <button class="btn-menu btn-deshabilitado" disabled>

        <button class="btn-menu btn-deshabilitado" disabled>
          <span class="btn-title">T07</span>
          <span class="btn-subtitle">Bajo Aragón y Cuencas Mineras - Teruel</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled>
          <span class="btn-title">T08</span>

        </button>
        <button class="btn-menu btn-deshabilitado" disabled>
          <span class="btn-title">T09</span>

        <button class="btn-menu btn-deshabilitado" disabled>

        <button class="btn-menu btn-deshabilitado" disabled>

        <button class="btn-menu btn-deshabilitado" disabled>
          <span class="btn-title">T14</span>

        <button class="btn-menu btn-deshabilitado" disabled>
          <span class="btn-title">T15</span>

        </button>
      </div>
    </div>
  </div>

  <!-- Tarjeta Flotante sobre el Mapa -->
  <div class="header-card" id="header-card" style="display: none;">
    <div class="header-title">
      <div class="line-badge">
        <span class="badge-tag" id="badge-linea-tag">T05</span>
        <div class="badge-text">
          <h1 id="vehicle-title">Buscando buses...</h1>
          <p>Localización en tiempo real</p>
        </div>
      </div>
      <div class="live-status" id="live-status">
        <div class="pulse-dot" id="live-dot"></div>
        <span id="live-status-text">CONECTANDO</span>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Coches Activos</span>
        <span class="info-value" id="bus-info">Conectando...</span>
      </div>
      <div class="info-item">
        <span class="info-label">Última actualización</span>
        <span class="info-value" id="last-updated" style="color: #e2e8f0;">--:--:--</span>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn-action btn-menu-back" onclick="volverAlMenu()">
        <i class="fa-solid fa-bars"></i> Menú
      </button>
      <button class="btn-action btn-layer active" id="btn-paradas" onclick="alternarParadas()" aria-pressed="true">
        <i class="fa-solid fa-location-dot"></i> Paradas
      </button>
      <button class="btn-action" onclick="centrarEnBus()">
        <i class="fa-solid fa-crosshairs"></i> Encuadrar
      </button>
    </div>
  </div>

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = null;
    let marcadoresBuses = {};
    let capasParadas = null;
    let paradasVisibles = true;
    let primeraCarga = true;
    let lineaActiva = null;
    let intervaloTimer = null;
    let solicitudEnCurso = false;
    let intervaloLlegadasParada = null;

    function escaparHTML(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[caracter]);
    }

    // Paleta coherente y legible sobre el mapa base de OpenStreetMap.
    // Se reutiliza también en los iconos de los autobuses.
    const COLORES_LINEA = {
      'T05-01': '#2563EB', // Azul
      'T05-20': '#0F766E', // Verde azulado
      'T05-50': '#C2410C'  // Terracota
    };
    const iconosBus = {};

    function obtenerIconoBus(linea) {
      const nombre = String(linea || lineaActiva || '').toUpperCase();
      const color = COLORES_LINEA[nombre] || '#2563eb';
      if (!iconosBus[nombre]) {
        iconosBus[nombre] = L.divIcon({
          className: 'custom-bus-icon',
          html: `
            <div class="bus-marker-container" style="--bus-color: ${color};">
              <div class="bus-marker-pulse"></div>
              <div class="bus-marker-icon">
                <i class="fa-solid fa-bus"></i>
              </div>
            </div>
          `,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });
      }
      return iconosBus[nombre];
    }

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: false }).setView([41.6563, -0.8773], 13);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
    }

    async function cargarLlegadasParada(stopId, popup) {
      const contenedor = popup.getElement()?.querySelector('.llegadas-parada');
      if (!contenedor) return;

      if (!contenedor.dataset.cargado) {
        contenedor.innerHTML = 'Consultando predicciones en tiempo real...';
      }

      try {
        const respuesta = await fetch(
          '/api/paradas/' + encodeURIComponent(stopId) + '/llegadas',
          { cache: 'no-store' }
        );
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || 'No se pudieron obtener las llegadas.');

        const llegadas = Array.isArray(datos.llegadas) ? datos.llegadas : [];
        if (!llegadas.length) {
          contenedor.innerHTML = datos.tiempo_real_disponible
            ? 'Ahora mismo no hay predicciones de llegada para esta parada.'
            : 'El servicio de predicciones en tiempo real no está disponible.';
          contenedor.dataset.cargado = 'true';
          return;
        }

        contenedor.innerHTML = llegadas.map(llegada => {
          const color = {
            'T05-01': '#2563EB',
            'T05-20': '#0F766E',
            'T05-50': '#C2410C'
          }[llegada.linea] || '#475569';
          const minutos = Number(llegada.minutos);
          const cuentaAtras = minutos <= 0 ? 'Llegando' : 'en ' + minutos + ' min';
          return '<div class="stop-arrival-row">' +
            '<span class="stop-arrival-line" style="color:' + color + ';">' +
              escaparHTML(llegada.linea) + '</span>' +
            '<span class="stop-arrival-destination">' + escaparHTML(llegada.destino) + '</span>' +
            '<span class="stop-arrival-time"><strong>' + escaparHTML(llegada.hora) +
              '</strong><small>' + escaparHTML(cuentaAtras) + '</small></span>' +
          '</div>';
        }).join('') +
        '<div class="stop-arrival-source">Predicciones en tiempo real</div>' +
        '<div class="stop-arrival-updated">Actualizado a las ' +
          escaparHTML(datos.actualizado || '--:--:--') + ' · Se actualiza cada 30 s</div>';
        contenedor.dataset.cargado = 'true';
      } catch (error) {
        contenedor.innerHTML = 'No se han podido cargar las llegadas. Vuelve a abrir la parada para intentarlo de nuevo.';
        console.error('Error consultando llegadas de la parada:', error);
      }
    }

    async function cargarCapasGTFS(linea) {
      if (capasParadas) map.removeLayer(capasParadas);
      capasParadas = L.layerGroup();
      paradasVisibles = true;
      actualizarBotonesCapas();

      try {
        const respuesta = await fetch('/api/mapa/' + encodeURIComponent(linea.toLowerCase()));
        if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
        const datos = await respuesta.json();

        const paradasUnicas = new Map();
        (datos.stops || []).forEach(parada => {
          if (parada.id && !paradasUnicas.has(parada.id)) paradasUnicas.set(parada.id, parada);
        });
        paradasUnicas.forEach(parada => {
          const marcador = L.circleMarker([parada.lat, parada.lon], {
            radius: 5, color: '#ffffff', weight: 2,
            fillColor: '#334155', fillOpacity: 1
          });
          const lineasParada = Array.isArray(parada.lineas) ? parada.lineas : [];
          const coloresLineas = {
            'T05-01': '#2563EB',
            'T05-20': '#0F766E',
            'T05-50': '#C2410C'
          };
          const insigniasLineas = lineasParada.map(nombre => {
            const color = coloresLineas[nombre] || '#475569';
            return '<span class="stop-line-badge" style="background:' + color + ';">' +
              escaparHTML(nombre) + '</span>';
          }).join('');

          marcador.bindPopup(
            '<div class="stop-popup">' +
              '<b class="stop-popup-title">' + escaparHTML(parada.name) + '</b>' +
              '<span class="stop-popup-label">Líneas que paran aquí</span>' +
              '<div class="stop-line-list">' +
                (insigniasLineas || '<span class="stop-arrival-state">Sin líneas identificadas</span>') +
              '</div>' +
              '<div class="stop-arrivals">' +
                '<span class="stop-popup-label">Próximas llegadas</span>' +
                '<div class="llegadas-parada stop-arrival-state">Consultando predicciones...</div>' +
              '</div>' +
            '</div>',
            { maxWidth: 310 }
          );
          marcador.on('popupopen', evento => {
            if (intervaloLlegadasParada) clearInterval(intervaloLlegadasParada);
            cargarLlegadasParada(parada.id, evento.popup);
            intervaloLlegadasParada = setInterval(
              () => cargarLlegadasParada(parada.id, evento.popup),
              30000
            );
          });
          marcador.on('popupclose', () => {
            if (intervaloLlegadasParada) {
              clearInterval(intervaloLlegadasParada);
              intervaloLlegadasParada = null;
            }
          });
          marcador.bindTooltip(escaparHTML(parada.name), {
            direction: 'top', offset: [0, -5], className: 'stop-label'
          });
          marcador.addTo(capasParadas);
        });

        if (paradasVisibles) capasParadas.addTo(map);
      } catch (error) {
        console.error('No se pudieron cargar las líneas y paradas GTFS:', error);
      }
    }

    function actualizarBotonesCapas() {
      const btnParadas = document.getElementById('btn-paradas');
      if (btnParadas) {
        btnParadas.classList.toggle('active', paradasVisibles);
        btnParadas.setAttribute('aria-pressed', String(paradasVisibles));
        btnParadas.innerHTML = '<i class="fa-solid fa-location-dot"></i> Paradas';
      }
    }

    function alternarParadas() {
      if (!capasParadas) return;
      paradasVisibles = !paradasVisibles;
      if (paradasVisibles) capasParadas.addTo(map);
      else map.removeLayer(capasParadas);
      actualizarBotonesCapas();
    }

    function iniciarMapa(linea) {
      lineaActiva = linea;
      document.getElementById('badge-linea-tag').innerText = linea;
      document.getElementById('pantalla-inicio').style.display = 'none';
      document.getElementById('header-card').style.display = 'block';

      initMap();
      primeraCarga = true;
      cargarCapasGTFS(linea);
      actualizarBus();

      if (intervaloTimer) clearInterval(intervaloTimer);
      intervaloTimer = setInterval(actualizarBus, 5000);
    }

    function volverAlMenu() {
      if (intervaloTimer) clearInterval(intervaloTimer);
      if (intervaloLlegadasParada) clearInterval(intervaloLlegadasParada);
      intervaloLlegadasParada = null;
      lineaActiva = null;

      Object.keys(marcadoresBuses).forEach(id => {
        map.removeLayer(marcadoresBuses[id]);
      });
      marcadoresBuses = {};

      document.getElementById('header-card').style.display = 'none';
      document.getElementById('pantalla-inicio').style.display = 'flex';
    }

    function actualizarEstadoConexion(estado, texto) {
      const indicador = document.getElementById('live-status');
      const punto = document.getElementById('live-dot');
      const etiqueta = document.getElementById('live-status-text');
      if (!indicador || !punto || !etiqueta) return;
      etiqueta.innerText = texto;
      indicador.dataset.estado = estado;
      punto.style.backgroundColor = estado === 'online' ? '#22c55e' : (estado === 'offline' ? '#ef4444' : '#f59e0b');
      punto.style.animation = estado === 'online' ? 'pulse-green 2s infinite' : 'none';
    }

    async function actualizarBus() {
      if (!lineaActiva || solicitudEnCurso) return;

      const lineaSolicitada = lineaActiva;
      solicitudEnCurso = true;
      try {
        const respuesta = await fetch('/api/buses/' + lineaSolicitada.toLowerCase());
        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
        const datos = await respuesta.json();
        // Ignorar respuestas antiguas si el usuario ha cambiado de concesión.
        if (lineaActiva !== lineaSolicitada) return;

        if (Array.isArray(datos) && datos.length > 0) {
          actualizarEstadoConexion('online', 'EN VIVO');
          const idsVivos = new Set();
          const detallesCoches = [];
          const puntosLatLng = [];

          datos.forEach((bus) => {
            const lat = bus.lat;
            const lon = bus.lon;
            const coche = bus.coche || bus.id || "S/N";
            const matricula = bus.matricula || "";
            const idUnico = bus.id || coche;
            const ocupacion = bus.ocupacion || "Sin datos";
            const occColor = bus.ocupacion_color || "gray";
            const retraso = bus.retraso || "En hora";
            const proximaParada = bus.proxima_parada || "En trayecto";
            const destino = bus.destino || "En trayecto";

            idsVivos.add(idUnico);
            puntosLatLng.push([lat, lon]);
            detallesCoches.push(matricula ? `${coche} (${matricula})` : `${coche}`);

            const popupContent = `
              <div style="text-align: center; font-family: sans-serif; padding: 6px; min-width: 180px;">
                <b style="font-size: 1.1rem; color: #2563eb;">Línea ${escaparHTML(bus.linea || lineaSolicitada)}</b><br>
                <span style="font-size: 0.95rem; font-weight: bold; color: #1e293b;">Nº Coche: ${escaparHTML(coche)}</span><br>
                ${matricula ? `<span style="font-size: 0.8rem; color: #64748b;">Matrícula: ${escaparHTML(matricula)}</span><br>` : ''}
                
                <div style="margin: 8px 0; padding: 6px 8px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.78rem; text-align: left;">
                  <div style="margin-bottom: 3px;"><i class="fa-solid fa-route" style="color: #8b5cf6; width: 16px;"></i> <b>Destino:</b> ${escaparHTML(destino)}</div>
                  <div style="margin-bottom: 3px;"><i class="fa-solid fa-clock" style="color: #2563eb; width: 16px;"></i> <b>Estado:</b> ${escaparHTML(retraso)}</div>
                  <div><i class="fa-solid fa-location-dot" style="color: #ef4444; width: 16px;"></i> <b>Próxima:</b> ${escaparHTML(proximaParada)}</div>
                </div>

                <div class="occ-badge occ-${occColor}">
                  <i class="fa-solid fa-users" style="margin-right: 4px;"></i>${escaparHTML(ocupacion)}
                </div>
              </div>
            `;

            const lineaBus = bus.linea || lineaSolicitada;
            const iconoBus = obtenerIconoBus(lineaBus);
            if (marcadoresBuses[idUnico]) {
              marcadoresBuses[idUnico].setLatLng([lat, lon]);
              marcadoresBuses[idUnico].setIcon(iconoBus);
              marcadoresBuses[idUnico].getPopup().setContent(popupContent);
            } else {
              marcadoresBuses[idUnico] = L.marker([lat, lon], { icon: iconoBus }).addTo(map);
              marcadoresBuses[idUnico].bindPopup(popupContent);
            }
          });

          // Eliminar marcadores inactivos
          Object.keys(marcadoresBuses).forEach(id => {
            if (!idsVivos.has(id)) {
              map.removeLayer(marcadoresBuses[id]);
              delete marcadoresBuses[id];
            }
          });

          const ahora = new Date();
          document.getElementById('vehicle-title').innerText = `${datos.length} coche(s) en servicio`;
          document.getElementById('bus-info').innerText = detallesCoches.join(' | ');
          document.getElementById('last-updated').innerText = ahora.toLocaleTimeString();

          if (primeraCarga && puntosLatLng.length > 0) {
            if (puntosLatLng.length === 1) {
              map.setView(puntosLatLng[0], 15);
            } else {
              const bounds = L.latLngBounds(puntosLatLng);
              map.fitBounds(bounds, { padding: [50, 50] });
            }
            primeraCarga = false;
          }
        } else {
          actualizarEstadoConexion('empty', 'SIN VEHÍCULOS');
          // Si la API no devuelve vehículos, no dejar autobuses antiguos en el mapa.
          Object.keys(marcadoresBuses).forEach(id => {
            map.removeLayer(marcadoresBuses[id]);
            delete marcadoresBuses[id];
          });
          document.getElementById('vehicle-title').innerText = "Sin servicio";
          document.getElementById('bus-info').innerText = "Sin señal de bus";
        }
      } catch (error) {
        actualizarEstadoConexion('offline', 'SIN CONEXIÓN');
        console.error('Error cargando datos:', error);
        if (lineaActiva === lineaSolicitada) {
          document.getElementById('bus-info').innerText = "No se han podido actualizar los datos";
        }
      } finally {
        solicitudEnCurso = false;
      }
    }

    function centrarEnBus() {
      const marcadores = Object.values(marcadoresBuses);
      if (marcadores.length === 1) {
        map.flyTo(marcadores[0].getLatLng(), 16, { duration: 1.2 });
      } else if (marcadores.length > 1) {
        const grupo = L.featureGroup(marcadores);
        map.flyToBounds(grupo.getBounds(), { padding: [60, 60], duration: 1.2 });
      }
    }
  </script>
</body>
</html>
