<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de Líneas GTFS - T05</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
        }
        .main-card {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            color: #1e293b;
            margin: 0 0 10px 0;
        }
        .badge-tag {
            display: inline-block;
            background-color: #10b981;
            color: white;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
        .route-id-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
            font-family: monospace;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus {
            border-color: #10b981;
        }
        .headsign-banner {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-left: 6px solid #10b981;
            padding: 14px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .headsign-banner label {
            color: #065f46;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .headsign-title {
            font-size: 20px;
            font-weight: 700;
            color: #047857;
            margin: 4px 0 0 0;
        }
        .timeline-container {
            margin-top: 25px;
        }
        .timeline-title {
            font-size: 16px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 15px;
        }
        .stops-list {
            list-style: none;
            padding-left: 20px;
            position: relative;
            margin: 0;
        }
        .stops-list::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            left: 7px;
            width: 4px;
            background-color: #10b981;
            border-radius: 2px;
        }
        .stops-list li {
            position: relative;
            padding: 8px 0 8px 20px;
            font-size: 14px;
            color: #334155;
        }
        .stops-list li::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 12px;
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 3px solid #10b981;
            border-radius: 50%;
        }
        .stops-list li:first-child {
            font-weight: 700;
            color: #0f172a;
        }
        .stops-list li:last-child {
            font-weight: 700;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <span id="routeBadge" class="badge-tag">T05-20</span>
        <h1 id="routeLongName">Castejón de Monegros - Zaragoza por Pueblos</h1>
        <div id="routeIdDisplay" class="route-id-text">ID: 61b2122d-39cc-44e6-89f0-3057b6528c54</div>
    </div>

    <div class="form-group">
        <label for="routeSelect">Seleccionar Línea:</label>
        <select id="routeSelect" onchange="onRouteChanged()">
            <!-- Opciones dinámicas -->
        </select>
    </div>

    <div class="form-group">
        <label for="dirSelect">Sentido del Trayecto:</label>
        <select id="dirSelect" onchange="updateTripInfo()">
            <option value="1">Zaragoza ➔ Destino (Castejón / Fraga)</option>
            <option value="0">Origen ➔ Zaragoza</option>
        </select>
    </div>

    <!-- Muestra el Destino real (trip_headsign) -->
    <div class="headsign-banner">
        <label>Destino en Pantalla del Autobús</label>
        <div id="headsignDisplay" class="headsign-title">Cargando...</div>
    </div>

    <div class="timeline-container">
        <div class="timeline-title">Paradas del Recorrido</div>
        <ul id="stopsContainer" class="stops-list">
            <!-- Paradas dinámicas -->
        </ul>
    </div>
</div>

<script>
    const CASTEJON_ID = "61b2122d-39cc-44e6-89f0-3057b6528c54";

    document.addEventListener("DOMContentLoaded", () => {
        initRoutes();
    });

    async function initRoutes() {
        try {
            const response = await fetch("/api/routes");
            const routes = await response.json();
            const select = document.getElementById("routeSelect");
            
            select.innerHTML = "";
            routes.forEach(route => {
                const opt = document.createElement("option");
                opt.value = route.route_id;
                opt.textContent = `[${route.short_name}] ${route.long_name}`;
                
                // Selecciona por defecto la línea de Castejón
                if (route.route_id === CASTEJON_ID) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });

            onRouteChanged();
        } catch (error) {
            console.error("Error al cargar rutas:", error);
        }
    }

    function onRouteChanged() {
        const routeId = document.getElementById("routeSelect").value;
        document.getElementById("routeIdDisplay").textContent = "ID: " + routeId;
        
        if (routeId === CASTEJON_ID) {
            document.getElementById("routeBadge").textContent = "T05-20";
            document.getElementById("routeLongName").textContent = "Castejón de Monegros - Zaragoza por Pueblos";
        } else {
            document.getElementById("routeBadge").textContent = "T05-01";
            document.getElementById("routeLongName").textContent = "Zaragoza - Fraga por el Eje del Ebro";
        }

        updateTripInfo();
    }

    async function updateTripInfo() {
        const routeId = document.getElementById("routeSelect").value;
        const dirId = document.getElementById("dirSelect").value;

        try {
            const response = await fetch(`/api/trip/active/${routeId}/${dirId}`);
            if (!response.ok) return;

            const data = await response.json();

            // MUESTRA EL DESTINO REAL DEL CARTELERO (trip_headsign)
            document.getElementById("headsignDisplay").textContent = data.trip_headsign;

            // RENDERIZA LAS PARADAS
            const container = document.getElementById("stopsContainer");
            container.innerHTML = "";

            data.stops.forEach((stopName) => {
                const li = document.createElement("li");
                li.textContent = stopName;
                container.appendChild(li);
            });

        } catch (error) {
            console.error("Error al obtener información del trayecto:", error);
        }
    }
</script>

</body>
</html>
