<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de Autobuses - Tiempo Real</title>
  
  <!-- Fuentes e Iconos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }

    /* Pantalla de Selección de Menú */
    #pantalla-inicio {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }

    .menu-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .menu-header i {
      font-size: 2.5rem;
      color: #38bdf8;
      margin-bottom: 12px;
    }

    .menu-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .menu-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .lista-botones {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 8px;
    }

    .lista-botones::-webkit-scrollbar {
      width: 6px;
    }
    .lista-botones::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .lista-botones::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .btn-menu {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      background: var(--bus-color, #2563eb);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      text-align: left;
    }

    .btn-menu:hover:not(.btn-deshabilitado) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .btn-menu:active:not(.btn-deshabilitado) {
      transform: translateY(0);
    }

    .btn-title {
      font-weight: 800;
      font-size: 1.05rem;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
      border-radius: 10px;
      flex-shrink: 0;
    }

    .btn-subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .btn-deshabilitado {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-deshabilitado .btn-title {
      background: rgba(255, 255, 255, 0.06);
      color: #64748b;
    }

    .btn-deshabilitado .btn-subtitle {
      color: #64748b;
    }

    #map {
      height: 100vh;
      width: 100vw;
      z-index: 1;
    }

    .header-card {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      max-width: 440px;
      margin: 0 auto;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px 20px;
      color: #ffffff;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .header-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header-quick-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .panel-toggle-button {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      color: #cbd5e1;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .panel-toggle-button:hover {
      background: rgba(255,255,255,.17);
      color: #fff;
    }

    .panel-show-button {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1100;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 12px;
      background: rgba(15,23,42,.95);
      color: #f8fafc;
      box-shadow: 0 8px 22px rgba(15,23,42,.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .panel-show-button:hover {
      background: #1e293b;
    }

    .panel-show-button[hidden] {
      display: none;
    }

    @media (max-width: 480px) {
      .panel-show-button {
        top: 10px;
        left: 10px;
        min-height: 40px;
      }
    }

    .line-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-tag {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 6px 16px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .badge-text h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .badge-text p {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #4ade80;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse-green 1.8s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.68rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }

    .info-value {
      font-size: 0.88rem;
      font-weight: 700;
      color: #38bdf8;
      margin-top: 2px;
      word-break: break-word;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.75rem;
      color: #64748b;
    }

    .btn-action {
      background: #2563eb;
      color: white;
      border: none;
      min-height: 34px;
      min-width: 0;
      padding: 7px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.76rem;
      line-height: 1;
      white-space: nowrap;
      box-sizing: border-box;
      flex: 0 0 auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      transform: none;
    }

    .btn-action:hover,
    .btn-action:focus,
    .btn-action:active {
      transform: none;
    }
    .btn-action:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    .btn-menu-back {
      background: rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-menu-back:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .bus-marker-container {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bus-marker-pulse {
      position: absolute;
      width: 100%;
      height: 100%;
      background: var(--bus-color, rgba(37, 99, 235, 0.4));
      border-radius: 50%;
      animation: bus-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes bus-ping {
      75%, 100% { transform: scale(1.6); opacity: 0; }
    }

    .bus-marker-icon {
      position: relative;
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 3px solid #ffffff;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      font-size: 16px;
    }

    .occ-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-top: 6px;
    }
    .occ-green { background: #dcfce7; color: #15803d; }
    .occ-yellow { background: #fef9c3; color: #a16207; }
    .occ-orange { background: #ffedd5; color: #c2410c; }
    .occ-red { background: #fee2e2; color: #b91c1c; }
    .occ-gray { background: #f1f5f9; color: #64748b; }
    .btn-layer { background: rgba(255,255,255,.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,.15); min-width: 78px; }
    .btn-layer.active { background: rgba(37,99,235,.24); border-color: rgba(96,165,250,.7); color: #bfdbfe; }
    .footer-actions { display: flex; align-items: center; justify-content: flex-start; gap: 8px; flex-wrap: nowrap; }
    .footer-actions .btn-menu-back { margin-right: auto; }
    @media (max-width: 480px) {
      .footer-actions { gap: 5px; }
      .btn-action { min-height: 32px; padding: 6px 8px; font-size: .7rem; gap: 4px; }
      .btn-layer { min-width: 70px; }
    }
    .leaflet-tooltip.stop-label { border: 0; border-radius: 6px; padding: 4px 7px; color: #0f172a; font-size: 11px; font-weight: 700; box-shadow: 0 2px 8px rgba(15,23,42,.18); }

    .stop-popup { min-width: 230px; color: #0f172a; }
    .stop-popup-title { display: block; font-size: 14px; line-height: 1.35; margin-bottom: 8px; }
    .stop-popup-label { display: block; color: #64748b; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin: 9px 0 5px; }
    .stop-line-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .stop-line-badge { display: inline-flex; align-items: center; border-radius: 6px; padding: 4px 7px; color: #fff; font-size: 10px; font-weight: 800; }
    .stop-arrivals { border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 2px; }
    .stop-arrival-row { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 7px; padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
    .stop-arrival-line { font-size: 10px; font-weight: 800; }
    .stop-arrival-destination { font-size: 11px; line-height: 1.25; color: #475569; }
    .stop-arrival-time { text-align: right; white-space: nowrap; }
    .stop-arrival-time strong { display: block; font-size: 14px; color: #0f172a; }
    .stop-arrival-time small { display: block; font-size: 10px; color: #2563eb; font-weight: 700; }
    .stop-arrival-source { display: inline-block; margin-top: 5px; color: #15803d; font-size: 10px; font-weight: 700; }
    .stop-arrival-state { color: #64748b; font-size: 11px; line-height: 1.4; padding: 8px 0; }
    .stop-arrival-updated { color: #94a3b8; font-size: 9px; padding-top: 6px; }

    .header-card { max-height: calc(100vh - 32px); overflow-y: auto; }
    .map-tools { margin-top: 10px; }
    .stop-search-row { display: flex; align-items: center; gap: 6px; }
    #buscador-paradas { min-width: 0; flex: 1; height: 36px; border: 1px solid rgba(255,255,255,.13); border-radius: 9px; background: rgba(255,255,255,.08); color: #f8fafc; padding: 0 10px; font-size: 12px; outline: none; }
    #buscador-paradas::placeholder { color: #94a3b8; }
    #buscador-paradas:focus { border-color: #60a5fa; box-shadow: 0 0 0 2px rgba(96,165,250,.14); }
    .tool-button { height: 36px; border: 1px solid rgba(255,255,255,.14); border-radius: 9px; padding: 0 10px; background: rgba(255,255,255,.09); color: #e2e8f0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; }
    .tool-button:hover { background: rgba(255,255,255,.16); }
    .favorite-count { display: inline-flex; min-width: 17px; height: 17px; align-items: center; justify-content: center; border-radius: 99px; background: #f59e0b; color: #1e293b; font-size: 10px; }
    .search-results { max-height: 190px; overflow-y: auto; margin-top: 5px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: #172338; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
    .search-results[hidden], .favorites-panel[hidden] { display: none; }
    .search-result { width: 100%; border: 0; border-bottom: 1px solid rgba(255,255,255,.07); background: transparent; color: #e2e8f0; text-align: left; padding: 9px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .search-result:last-child { border-bottom: 0; }
    .search-result:hover { background: rgba(255,255,255,.08); }
    .search-result-name { font-size: 11px; font-weight: 700; }
    .search-result-meta { font-size: 10px; color: #94a3b8; white-space: nowrap; }
    .search-empty { padding: 10px; font-size: 11px; color: #94a3b8; }
    .line-filter-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .filter-caption { color: #94a3b8; font-size: 10px; text-transform: uppercase; font-weight: 800; letter-spacing: .05em; margin-right: 2px; }
    .line-filter { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,.12); border-radius: 99px; padding: 4px 7px; background: rgba(255,255,255,.04); color: #94a3b8; font-size: 10px; font-weight: 800; cursor: pointer; }
    .line-filter.active { color: #f8fafc; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }
    .filter-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; }
    #lista-filtros-lineas { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .concession-status { display: block; margin-top: 3px; font-size: 10px; line-height: 1.25; font-weight: 500; opacity: .88; }
    .btn-menu.btn-deshabilitado .concession-status { color: #64748b; }
    .favorites-panel { margin-top: 8px; padding: 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: #172338; }
    .favorites-panel-heading { display: flex; align-items: center; justify-content: space-between; color: #f8fafc; font-size: 12px; margin-bottom: 7px; }
    .tool-close { border: 0; background: transparent; color: #cbd5e1; font-size: 21px; cursor: pointer; line-height: 1; }
    .favorite-row { display: flex; align-items: center; gap: 5px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .favorite-go { flex: 1; min-width: 0; border: 0; background: none; color: #e2e8f0; text-align: left; cursor: pointer; font-size: 11px; font-weight: 700; }
    .favorite-action { border: 1px solid rgba(255,255,255,.13); border-radius: 6px; background: rgba(255,255,255,.07); color: #cbd5e1; padding: 5px 7px; cursor: pointer; font-size: 10px; white-space: nowrap; }
    .favorite-action.enabled { color: #fbbf24; border-color: rgba(251,191,36,.4); }
    .favorites-note { margin-top: 7px; color: #94a3b8; font-size: 9px; line-height: 1.35; }
    .stop-popup-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .stop-favorite-button { flex: 0 0 auto; border: 1px solid #e2e8f0; border-radius: 7px; background: #fff; padding: 5px 7px; color: #64748b; cursor: pointer; font-size: 10px; font-weight: 700; }
    .stop-favorite-button.saved { color: #b45309; border-color: #fcd34d; background: #fffbeb; }
    .stop-date-input { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 7px; margin: 4px 0 7px; color: #0f172a; font-size: 11px; background: #fff; }
    .stop-schedule { border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 2px; }
    .stop-schedule-note { font-size: 9px; color: #94a3b8; padding-top: 5px; }
    .arrival-status { display: block; font-size: 9px; margin-top: 3px; font-weight: 700; }
    .arrival-status.live { color: #15803d; }
    .arrival-status.scheduled { color: #64748b; }
    @media (max-width: 480px) {
      .header-card { top: 8px; left: 8px; right: 8px; max-height: calc(100vh - 16px); padding: 10px; }
      .stop-search-row { gap: 4px; }
      .tool-button { padding: 0 7px; font-size: 10px; }
      #buscador-paradas { font-size: 11px; }
    }
    @media (max-width: 480px) {
      .header-card { padding: 12px; }
      .footer-actions { gap: 5px; flex-wrap: nowrap; }
      .btn-action { padding: 6px 8px; font-size: .7rem; }
    }

    /* En móviles, la ficha de una parada dispone del espacio del mapa.
       El panel superior se recupera automáticamente al cerrar la ficha. */
    body.parada-seleccionada-movil #btn-mostrar-panel {
      display: none !important;
    }

    @media (max-width: 640px) {
      .stop-popup {
        min-width: min(230px, calc(100vw - 100px));
        max-width: calc(100vw - 88px);
      }

      .leaflet-popup-content {
        max-width: calc(100vw - 78px);
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
    }
  </style>
</head>
<body>

  <!-- Pantalla de Inicio / Selección de Línea -->
  <div id="pantalla-inicio">
    <div class="menu-card">
      <div class="menu-header">
        <i class="fa-solid fa-bus-simple"></i>
        <h1>Líneas en Tiempo Real</h1>
        <p>Selecciona una línea para abrir el mapa</p>
      </div>

      <div class="lista-botones">
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T01">
          <span class="btn-title">T01</span>
          <span class="btn-subtitle">Jacetania y Alto Gállego - Zaragoza</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T02">
          <span class="btn-title">T02</span>
          <span class="btn-subtitle">Sobrarbe y Ribagorza - Barbastro</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T03">
          <span class="btn-title">T03</span>
          <span class="btn-subtitle">Fraga - Huesca por Monzón</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T04">
          <span class="btn-title">T04</span>
          <span class="btn-subtitle">Monegros - Huesca y Zaragoza</span>
        </button>
        
        <!-- Concesión Activa -->
        <button class="btn-menu" data-concesion="T05">
          <span class="btn-title">T05</span>
          <span class="btn-subtitle">Fraga / Castejón - Zaragoza</span>
        </button>
        
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T06">
          <span class="btn-title">T06</span>
          <span class="btn-subtitle">Bajo Aragón - Zaragoza</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T07">
          <span class="btn-title">T07</span>
          <span class="btn-subtitle">Bajo Aragón y Cuencas Mineras - Teruel</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T08">
          <span class="btn-title">T08</span>
          <span class="btn-subtitle">Maestrazgo - Teruel</span>
        </button>
        <button class="btn-menu btn-deshabilitado" disabled data-concesion="T09">

  <button class="panel-show-button" id="btn-mostrar-panel" type="button"
    title="Mostrar panel de información" aria-label="Mostrar panel de información"

  <!-- Mapa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // El historial local anterior se ha retirado; eliminar su base IndexedDB
    // sin tocar los favoritos, que se guardan en localStorage.
    if ('indexedDB' in window) {
      const borrarHistorialAnterior = indexedDB.deleteDatabase('MapaTPAHistorial');
      borrarHistorialAnterior.onerror = () => {
        console.warn('No se pudo eliminar el historial local anterior.');
      };
      borrarHistorialAnterior.onblocked = () => {
        console.warn('Cierra las pestañas antiguas de Mapa TPA para completar la eliminación del historial local.');
      };
    }

    let map = null;
    let marcadoresBuses = {};
    let capasParadas = null;
    let paradasVisibles = true;
    let primeraCarga = true;
    let lineaActiva = null;
    let intervaloTimer = null;
    let solicitudEnCurso = false;
    let intervaloLlegadasParada = null;
    let restaurarPanelMovilTrasPopup = false;
    let marcadoresParadas = {};
    let listaParadas = [];
    let filtrosLineas = { 'T05-01': true, 'T05-20': true, 'T05-50': true };
    const CLAVE_FAVORITOS = 'mapa-tpa-favoritos-v1';
    let favoritosParadas = leerFavoritos();
    let intervaloAlertasFavoritos = null;
    let herramientasInicializadas = false;
    let catalogoConcesiones = {};
    let configuracionConcesionActiva = null;
    const COLORES_LINEA = {
      'T05-01': '#2563EB', 'T05-20': '#0F766E', 'T05-50': '#C2410C'
    };

    function escaparHTML(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[caracter]);
    }

    async function cargarCatalogoConcesiones() {
      const lista = document.querySelector('.lista-botones');
      if (!lista) return;
      try {
        const respuesta = await fetch('/api/concesiones', { cache: 'no-store' });
        if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
        const datos = await respuesta.json();
        catalogoConcesiones = Object.fromEntries((datos.concesiones || []).map(item => [item.codigo, item]));
        lista.querySelectorAll('[data-concesion]').forEach(boton => {
          const codigo = boton.dataset.concesion;
          const configuracion = catalogoConcesiones[codigo];
          if (!configuracion) return;
          const subtitulo = boton.querySelector('.btn-subtitle');
          const disponible = !!configuracion.disponible;
          boton.disabled = !disponible;
          boton.classList.toggle('btn-deshabilitado', !disponible);
          boton.title = configuracion.estado || '';
          if (subtitulo) subtitulo.innerHTML = escaparHTML(configuracion.descripcion) +
            '<small class="concession-status">' + escaparHTML(configuracion.estado) + '</small>';
          boton.onclick = disponible ? () => iniciarMapa(codigo) : null;
        });
      } catch (error) {
        console.warn('No se pudo cargar el catálogo de concesiones:', error);
        const botonT05 = lista.querySelector('[data-concesion="T05"]');
        if (botonT05) botonT05.onclick = () => iniciarMapa('T05');
      }
    }

    function leerFavoritos() {
      try {
        const almacenados = JSON.parse(localStorage.getItem(CLAVE_FAVORITOS) || '[]');
        return Array.isArray(almacenados) ? almacenados : [];
      } catch (_) {
        return [];
      }
    }

    function guardarFavoritos() {
      try {
        localStorage.setItem(CLAVE_FAVORITOS, JSON.stringify(favoritosParadas));
      } catch (error) {
        console.warn('No se pudieron guardar los favoritos en este navegador:', error);
      }
      renderFavoritos();
    }

    function normalizarTexto(valor) {
      return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function distanciaEntrePuntos(lat1, lon1, lat2, lon2) {
      const rad = grados => grados * Math.PI / 180;
      const dLat = rad(lat2 - lat1);
      const dLon = rad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function seleccionarParada(stopId) {
      const marcador = marcadoresParadas[String(stopId)];
      if (!marcador || !map) return;
      if (!paradasVisibles) alternarParadas();
      map.flyTo(marcador.getLatLng(), 16, { duration: 0.8 });
      marcador.openPopup();
      const resultados = document.getElementById('resultados-paradas');
      if (resultados) resultados.hidden = true;
      const buscador = document.getElementById('buscador-paradas');
      if (buscador) buscador.value = '';
    }

    function mostrarResultadosParadas(paradas, detalle = '') {
      const contenedor = document.getElementById('resultados-paradas');
      if (!contenedor) return;
      if (!paradas.length) {
        contenedor.innerHTML = '<div class="search-empty">' +
          escaparHTML(detalle || 'No se han encontrado paradas.') + '</div>';
        contenedor.hidden = false;
        return;
      }
      contenedor.innerHTML = paradas.slice(0, 8).map(parada => {
        const lineas = (parada.lineas || []).join(' · ');
        const distancia = Number.isFinite(parada.distancia)
          ? (parada.distancia < 1000 ? Math.round(parada.distancia) + ' m' : (parada.distancia / 1000).toFixed(1) + ' km')
          : lineas;
        return '<button type="button" class="search-result" data-stop-id="' + escaparHTML(parada.id) + '">' +
          '<span class="search-result-name">' + escaparHTML(parada.name) + '</span>' +
          '<span class="search-result-meta">' + escaparHTML(distancia) + '</span>' +
        '</button>';
      }).join('');
      contenedor.hidden = false;
    }

    function buscarParadasCercanas() {
      if (!navigator.geolocation) {
        mostrarResultadosParadas([], 'Este navegador no permite consultar tu ubicación.');
        return;
      }
      const boton = document.getElementById('btn-paradas-cercanas');
      if (boton) boton.disabled = true;
      navigator.geolocation.getCurrentPosition(posicion => {
        if (boton) boton.disabled = false;
        const { latitude, longitude } = posicion.coords;
        const cercanas = listaParadas.map(parada => ({
          ...parada,
          distancia: distanciaEntrePuntos(latitude, longitude, Number(parada.lat), Number(parada.lon))
        })).sort((a, b) => a.distancia - b.distancia);
        map.setView([latitude, longitude], 14);
        mostrarResultadosParadas(cercanas, 'No hay paradas cargadas.');
      }, error => {
        if (boton) boton.disabled = false;
        const mensaje = error.code === 1
          ? 'No has permitido el acceso a la ubicación.'
          : 'No se ha podido obtener tu ubicación. Comprueba el GPS e inténtalo de nuevo.';
        mostrarResultadosParadas([], mensaje);
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    }

    function actualizarBotonFavorito(boton, stopId) {
      if (!boton) return;
      const guardado = favoritosParadas.some(favorito => String(favorito.id) === String(stopId));
      boton.classList.toggle('saved', guardado);
      boton.innerHTML = guardado
        ? '<i class="fa-solid fa-star"></i> Guardada'
        : '<i class="fa-regular fa-star"></i> Guardar';
    }

    function alternarFavorito(parada) {
      const indice = favoritosParadas.findIndex(favorito => String(favorito.id) === String(parada.id));
      if (indice >= 0) {
        favoritosParadas.splice(indice, 1);
      } else {
        favoritosParadas.push({
          id: String(parada.id),
          nombre: parada.name,
          lat: Number(parada.lat),
          lon: Number(parada.lon),
          avisos: false,
          notificados: []
        });
      }
      guardarFavoritos();
    }

    function renderFavoritos() {
      const contenedor = document.getElementById('lista-favoritos');
      const contador = document.getElementById('contador-favoritos');
      if (contador) contador.textContent = String(favoritosParadas.length);
      if (!contenedor) return;
      if (!favoritosParadas.length) {
        contenedor.innerHTML = '<div class="search-empty">Todavía no has guardado ninguna parada. Pulsa la estrella al abrir una parada.</div>';
        return;
      }
      contenedor.innerHTML = favoritosParadas.map(favorito =>
        '<div class="favorite-row">' +
          '<button type="button" class="favorite-go" data-fav-action="go" data-stop-id="' + escaparHTML(favorito.id) + '">' +
            escaparHTML(favorito.nombre) +
          '</button>' +
          '<button type="button" class="favorite-action ' + (favorito.avisos ? 'enabled' : '') +
            '" data-fav-action="alerts" data-stop-id="' + escaparHTML(favorito.id) + '">' +
            (favorito.avisos ? 'Avisos ON' : 'Avisos OFF') +
          '</button>' +
          '<button type="button" class="favorite-action" data-fav-action="remove" data-stop-id="' + escaparHTML(favorito.id) + '" aria-label="Eliminar favorito">' +
            '<i class="fa-solid fa-trash"></i>' +
          '</button>' +
        '</div>'
      ).join('');
    }

    async function alternarAvisosFavorito(stopId) {
      const favorito = favoritosParadas.find(item => String(item.id) === String(stopId));
      if (!favorito) return;
      if (favorito.avisos) {
        favorito.avisos = false;
        guardarFavoritos();
        return;
      }
      if (!('Notification' in window)) {
        alert('Este navegador no admite notificaciones web.');
        return;
      }
      let permiso = Notification.permission;
      if (permiso !== 'granted') {
        try {
          permiso = await Notification.requestPermission();
        } catch (_) {
          permiso = 'denied';
        }
      }
      if (permiso === 'granted') {
        favorito.avisos = true;
        guardarFavoritos();
        comprobarAlertasFavoritos();
      } else {
        alert('No se han autorizado las notificaciones. Puedes activarlas desde los ajustes del navegador.');
      }
    }

    let consultaAlertasEnCurso = false;
    async function comprobarAlertasFavoritos() {
      if (consultaAlertasEnCurso || !('Notification' in window) || Notification.permission !== 'granted') return;
      const activos = favoritosParadas.filter(favorito => favorito.avisos);
      if (!activos.length) return;
      consultaAlertasEnCurso = true;
      try {
        for (const favorito of activos) {
          const respuesta = await fetch('/api/paradas/' + encodeURIComponent(favorito.id) + '/llegadas', { cache: 'no-store' });
          if (!respuesta.ok) continue;
          const datos = await respuesta.json();
          for (const llegada of (datos.llegadas || [])) {
            const minutos = Number(llegada.minutos);
            if (!Number.isFinite(minutos) || minutos < 0 || minutos > 10) continue;
            const clave = fechaLocalISO() + ':' + String(llegada.trip_id || llegada.linea + ':' + llegada.timestamp);
            favorito.notificados = Array.isArray(favorito.notificados) ? favorito.notificados : [];
            if (favorito.notificados.includes(clave)) continue;

            const textoMinutos = minutos <= 0 ? 'está llegando' : 'llega en ' + minutos + ' minutos';
            new Notification(llegada.linea + ' · ' + favorito.nombre, {
              body: 'Dirección ' + llegada.destino + ': ' + textoMinutos + '.',
              tag: 't05-' + favorito.id + '-' + clave
            });
            favorito.notificados.push(clave);
            favorito.notificados = favorito.notificados.slice(-30);
          }
        }
        guardarFavoritos();
      } catch (error) {
        console.warn('No se pudieron comprobar los avisos de favoritos:', error);
      } finally {
        consultaAlertasEnCurso = false;
      }
    }

    function inicializarHerramientas() {
      if (herramientasInicializadas) return;
      herramientasInicializadas = true;

      const buscador = document.getElementById('buscador-paradas');
      const resultados = document.getElementById('resultados-paradas');
      buscador?.addEventListener('input', () => {
        const consulta = normalizarTexto(buscador.value);
        if (consulta.length < 2) {
          resultados.hidden = true;
          return;
        }
        const coincidencias = listaParadas.filter(parada =>
          normalizarTexto(parada.name).includes(consulta)
        ).sort((a, b) => a.name.localeCompare(b.name, 'es'));
        mostrarResultadosParadas(coincidencias, 'No hay ninguna parada con ese nombre.');
      });

      resultados?.addEventListener('click', evento => {
        const boton = evento.target.closest('[data-stop-id]');
        if (boton) seleccionarParada(boton.dataset.stopId);
      });
      document.getElementById('btn-paradas-cercanas')?.addEventListener('click', buscarParadasCercanas);
      document.getElementById('btn-mostrar-favoritos')?.addEventListener('click', () => {
        const panel = document.getElementById('panel-favoritos');
        panel.hidden = !panel.hidden;
        renderFavoritos();
      });
      document.getElementById('btn-cerrar-favoritos')?.addEventListener('click', () => {
        document.getElementById('panel-favoritos').hidden = true;
      });
      document.getElementById('lista-favoritos')?.addEventListener('click', evento => {
        const boton = evento.target.closest('[data-fav-action]');
        if (!boton) return;
        const { favAction, stopId } = boton.dataset;
        if (favAction === 'go') seleccionarParada(stopId);
        if (favAction === 'alerts') alternarAvisosFavorito(stopId);
        if (favAction === 'remove') {
          favoritosParadas = favoritosParadas.filter(favorito => String(favorito.id) !== String(stopId));
          guardarFavoritos();
        }
      });
      document.getElementById('lista-filtros-lineas')?.addEventListener('click', evento => {
        const boton = evento.target.closest('[data-line-filter]');
        if (boton) toggleFiltroLinea(boton.dataset.lineFilter);
      });

      renderFavoritos();
      if (!intervaloAlertasFavoritos) {
        intervaloAlertasFavoritos = setInterval(comprobarAlertasFavoritos, 60000);
      }
    }

    function actualizarFiltrosLineas(rutas = []) {
      const contenedor = document.getElementById('contenedor-filtros-lineas');
      const lista = document.getElementById('lista-filtros-lineas');
      if (!contenedor || !lista) return;
      const lineas = new Map();
      rutas.forEach(ruta => {
        const nombre = String(ruta.short_name || '').trim();
        if (!nombre) return;
        const color = '#' + String(ruta.color || '2563EB').replace(/^#/, '');
        lineas.set(nombre, color);
        COLORES_LINEA[nombre] = color;
      });
      filtrosLineas = Object.fromEntries([...lineas.keys()].map(nombre => [nombre, true]));
      lista.innerHTML = [...lineas.entries()].map(([nombre, color]) =>
        '<button class="line-filter active" type="button" data-line-filter="' + escaparHTML(nombre) + '" aria-pressed="true">' +
          '<span class="filter-dot" style="background:' + escaparHTML(color) + '"></span>' +
          escaparHTML(nombre) + '</button>'
      ).join('');
      contenedor.hidden = !configuracionConcesionActiva?.funciones?.tiempo_real || !lineas.size;
    }

    function toggleFiltroLinea(linea) {
      filtrosLineas[linea] = !filtrosLineas[linea];
      const boton = document.querySelector('[data-line-filter="' + CSS.escape(linea) + '"]');
      if (boton) {
        boton.classList.toggle('active', filtrosLineas[linea]);
        boton.setAttribute('aria-pressed', String(filtrosLineas[linea]));
      }
      aplicarFiltrosLineas();
    }

    function aplicarFiltrosLineas() {
      Object.values(marcadoresBuses).forEach(marcador => {
        const visible = filtrosLineas[marcador._lineaBus] !== false;
        if (visible && !map.hasLayer(marcador)) marcador.addTo(map);
        else if (!visible && map.hasLayer(marcador)) map.removeLayer(marcador);
      });
    }

    const iconosBus = {};

    function obtenerIconoBus(linea) {
      const nombre = String(linea || lineaActiva || '').toUpperCase();
      const color = COLORES_LINEA[nombre] || '#2563eb';
      if (!iconosBus[nombre]) {
        iconosBus[nombre] = L.divIcon({
          className: 'custom-bus-icon',
          html: `
            <div class="bus-marker-container" style="--bus-color: ${color};">
              <div class="bus-marker-pulse"></div>
              <div class="bus-marker-icon">
                <i class="fa-solid fa-bus"></i>
              </div>
            </div>
          `,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });
      }
      return iconosBus[nombre];
    }

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: false }).setView([41.6563, -0.8773], 13);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
    }

    function fechaLocalISO(fecha = new Date()) {
      const anio = fecha.getFullYear();
      const mes = String(fecha.getMonth() + 1).padStart(2, '0');
      const dia = String(fecha.getDate()).padStart(2, '0');
      return anio + '-' + mes + '-' + dia;
    }

    function desplazarFechaISO(fechaISO, dias) {
      const [anio, mes, dia] = fechaISO.split('-').map(Number);
      const fecha = new Date(anio, mes - 1, dia);
      fecha.setDate(fecha.getDate() + dias);
      return fechaLocalISO(fecha);
    }

    async function cargarLlegadasParada(stopId, popup, fecha = fechaLocalISO()) {
      const elementoPopup = popup.getElement();
      const contenedor = elementoPopup?.querySelector('.llegadas-parada');
      const selectorFecha = elementoPopup?.querySelector('.stop-date-input');
      if (!contenedor) return;

      if (selectorFecha && selectorFecha.value !== fecha) selectorFecha.value = fecha;
      contenedor.innerHTML = 'Consultando horario oficial y predicciones...';

      try {
        const [respuestaRT, respuestaHorario] = await Promise.all([
          fetch('/api/paradas/' + encodeURIComponent(stopId) + '/llegadas', { cache: 'no-store' }),
          fetch('/api/paradas/' + encodeURIComponent(stopId) + '/horarios?fecha=' + encodeURIComponent(fecha), { cache: 'no-store' })
        ]);
        const [datosRT, datosHorario] = await Promise.all([
          respuestaRT.json(),
          respuestaHorario.json()
        ]);

        if (!respuestaHorario.ok) throw new Error(datosHorario.error || 'No se pudo cargar el horario.');
        const programadas = Array.isArray(datosHorario.horarios) ? datosHorario.horarios : [];
        const tiempoReal = respuestaRT.ok && Array.isArray(datosRT.llegadas) ? datosRT.llegadas : [];
        const tiempoRealPorViaje = new Map(
          tiempoReal.filter(item => item.trip_id).map(item => [item.trip_id, item])
        );

        const elementos = programadas.map(item => {
          const prediccion = tiempoRealPorViaje.get(item.trip_id);
          return {
            ...item,
            horaMostrada: prediccion?.hora || item.hora,
            timestampMostrado: prediccion?.timestamp || item.timestamp,
            minutos: prediccion?.minutos,
            estado: prediccion ? 'En vivo' : 'Programado',
            delta: prediccion ? Number(prediccion.timestamp) - Number(item.timestamp) : null
          };
        });

        const idsIncluidos = new Set(programadas.map(item => item.trip_id).filter(Boolean));
        tiempoReal.filter(item => !item.trip_id || !idsIncluidos.has(item.trip_id)).forEach(item => {
          elementos.push({
            ...item,
            horaMostrada: item.hora,
            timestampMostrado: item.timestamp,
            estado: 'En vivo',
            delta: null
          });
        });
        elementos.sort((a, b) => Number(a.timestampMostrado || 0) - Number(b.timestampMostrado || 0));

        if (!elementos.length) {
          const mensajes = [];
          if (datosHorario.mensaje) mensajes.push(escaparHTML(datosHorario.mensaje));
          if (!respuestaRT.ok || !datosRT.tiempo_real_disponible) {
            mensajes.push('No hay conexión con las predicciones en tiempo real.');
          } else if (!tiempoReal.length) {
            mensajes.push('Ahora mismo no hay predicciones en tiempo real para esta parada.');
          }
          if (datosHorario.vigencia_gtfs_hasta) {
            mensajes.push('El fichero GTFS disponible llega hasta ' + escaparHTML(datosHorario.vigencia_gtfs_hasta) + '.');
          }
          contenedor.innerHTML = '<div class="stop-arrival-state">' + mensajes.join('<br>') + '</div>';
          return;
        }

        const html = elementos.slice(0, 20).map(item => {
          const color = COLORES_LINEA[item.linea] || '#475569';
          const estado = item.estado === 'En vivo'
            ? (Number(item.minutos) <= 0 ? 'Llegando' : 'en ' + Number(item.minutos) + ' min')
            : 'Horario oficial';
          const diferencia = item.estado === 'En vivo' && item.delta !== null
            ? (item.delta > 60 ? ' · +' + Math.round(item.delta / 60) + ' min' : item.delta < -60 ? ' · ' + Math.round(item.delta / 60) + ' min' : '')
            : '';
          return '<div class="stop-arrival-row">' +
            '<span class="stop-arrival-line" style="color:' + color + ';">' + escaparHTML(item.linea) + '</span>' +
            '<span class="stop-arrival-destination">' + escaparHTML(item.destino) +
              '<small class="arrival-status ' + (item.estado === 'En vivo' ? 'live' : 'scheduled') + '">' +
                escaparHTML(item.estado + diferencia) + '</small></span>' +
            '<span class="stop-arrival-time"><strong>' + escaparHTML(item.horaMostrada) +
              '</strong><small>' + escaparHTML(estado) + '</small></span>' +
          '</div>';
        }).join('');

        const avisoVigencia = datosHorario.vigencia_gtfs_hasta
          ? '<div class="stop-arrival-updated">Horario GTFS disponible hasta ' + escaparHTML(datosHorario.vigencia_gtfs_hasta) + '</div>'
          : '';
        const actualizado = datosRT.actualizado
          ? '<div class="stop-arrival-updated">Tiempo real consultado a las ' + escaparHTML(datosRT.actualizado) + ' · actualización cada 30 s</div>'
          : '';
        contenedor.innerHTML = html +
          '<div class="stop-arrival-source">En vivo = predicción GTFS-RT · Programado = horario oficial</div>' +
          actualizado + avisoVigencia;
      } catch (error) {
        contenedor.innerHTML = 'No se han podido cargar los horarios y llegadas de esta parada.';
        console.error('Error consultando horarios de la parada:', error);
      }
    }

    async function cargarCapasGTFS(linea) {
      if (capasParadas) map.removeLayer(capasParadas);
      capasParadas = L.layerGroup();
      paradasVisibles = true;
      actualizarBotonesCapas();

      try {
        const respuesta = await fetch('/api/mapa/' + encodeURIComponent(linea.toLowerCase()));
        if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);
        const datos = await respuesta.json();
        actualizarFiltrosLineas(datos.routes || []);

        const paradasUnicas = new Map();
        (datos.stops || []).forEach(parada => {
          if (parada.id && !paradasUnicas.has(parada.id)) paradasUnicas.set(parada.id, parada);
        });
        listaParadas = Array.from(paradasUnicas.values());
        marcadoresParadas = {};
        paradasUnicas.forEach(parada => {
          const marcador = L.circleMarker([parada.lat, parada.lon], {
            radius: 5, color: '#ffffff', weight: 2,
            fillColor: '#334155', fillOpacity: 1
          });
          const lineasParada = Array.isArray(parada.lineas) ? parada.lineas : [];
          const coloresLineas = {
            'T05-01': '#2563EB',
            'T05-20': '#0F766E',
            'T05-50': '#C2410C'
          };
          const insigniasLineas = lineasParada.map(nombre => {
            const color = coloresLineas[nombre] || '#475569';
            return '<span class="stop-line-badge" style="background:' + color + ';">' +
              escaparHTML(nombre) + '</span>';
          }).join('');

          marcador.bindPopup(
            '<div class="stop-popup">' +
              '<div class="stop-popup-top">' +
                '<b class="stop-popup-title">' + escaparHTML(parada.name) + '</b>' +
                '<button type="button" class="stop-favorite-button"><i class="fa-regular fa-star"></i> Guardar</button>' +
              '</div>' +
              '<span class="stop-popup-label">Líneas que paran aquí</span>' +
              '<div class="stop-line-list">' +
                (insigniasLineas || '<span class="stop-arrival-state">Sin líneas identificadas</span>') +
              '</div>' +
              '<div class="stop-arrivals">' +
                '<span class="stop-popup-label">Próximas salidas · horario y tiempo real</span>' +
                '<input type="date" class="stop-date-input" aria-label="Fecha de las salidas">' +
                '<div class="llegadas-parada stop-arrival-state">Consultando horarios y predicciones...</div>' +
                '<div class="stop-schedule-note">“En vivo” utiliza una predicción GTFS-RT; “Programado” corresponde al horario oficial GTFS.</div>' +
              '</div>' +
            '</div>',
            {
              maxWidth: window.matchMedia('(max-width: 640px)').matches
                ? Math.max(220, Math.min(310, window.innerWidth - 58))
                : 310,
              maxHeight: window.matchMedia('(max-width: 640px)').matches
                ? Math.max(220, Math.floor(window.innerHeight * 0.62))
                : undefined
            }
          );
          marcador.on('popupopen', evento => {
            if (intervaloLlegadasParada) clearInterval(intervaloLlegadasParada);

            if (window.matchMedia('(max-width: 640px)').matches) {
              const panel = document.getElementById('header-card');
              restaurarPanelMovilTrasPopup = !!panel && getComputedStyle(panel).display !== 'none';
              if (restaurarPanelMovilTrasPopup) ocultarPanel();
              document.body.classList.add('parada-seleccionada-movil');
            }

            const elemento = evento.popup.getElement();
            const selectorFecha = elemento?.querySelector('.stop-date-input');
            const hoy = fechaLocalISO();
            if (selectorFecha) {
              selectorFecha.min = hoy;
              selectorFecha.max = desplazarFechaISO(hoy, 14);
              selectorFecha.value = hoy;
              selectorFecha.addEventListener('change', () => {
                cargarLlegadasParada(parada.id, evento.popup, selectorFecha.value);
              });
            }

            const botonFavorito = elemento?.querySelector('.stop-favorite-button');
            actualizarBotonFavorito(botonFavorito, parada.id);
            botonFavorito?.addEventListener('click', () => {
              alternarFavorito(parada);
              actualizarBotonFavorito(botonFavorito, parada.id);
            });

            cargarLlegadasParada(parada.id, evento.popup, hoy);
            intervaloLlegadasParada = setInterval(() => {
              const fechaActual = selectorFecha?.value || hoy;
              cargarLlegadasParada(parada.id, evento.popup, fechaActual);
            }, 30000);
          });
          marcador.on('popupclose', () => {
            if (intervaloLlegadasParada) {
              clearInterval(intervaloLlegadasParada);
              intervaloLlegadasParada = null;
            }

            if (document.body.classList.contains('parada-seleccionada-movil')) {
              document.body.classList.remove('parada-seleccionada-movil');
              if (restaurarPanelMovilTrasPopup) mostrarPanel();
              restaurarPanelMovilTrasPopup = false;
            }
          });
          marcador.bindTooltip(escaparHTML(parada.name), {
            direction: 'top', offset: [0, -5], className: 'stop-label'
          });
          marcador.addTo(capasParadas);
          marcadoresParadas[String(parada.id)] = marcador;
        });

        if (paradasVisibles) capasParadas.addTo(map);
        renderFavoritos();
      } catch (error) {
        console.error('No se pudieron cargar las líneas y paradas GTFS:', error);
      }
    }

    function actualizarBotonesCapas() {
      const btnParadas = document.getElementById('btn-paradas');
      if (btnParadas) {
        btnParadas.classList.toggle('active', paradasVisibles);
        btnParadas.setAttribute('aria-pressed', String(paradasVisibles));
        btnParadas.innerHTML = '<i class="fa-solid fa-location-dot"></i> Paradas';
      }
    }

    function alternarParadas() {
      if (!capasParadas) return;
      paradasVisibles = !paradasVisibles;
      if (paradasVisibles) capasParadas.addTo(map);
      else map.removeLayer(capasParadas);
      actualizarBotonesCapas();
    }

    function ocultarPanel() {
      const panel = document.getElementById('header-card');
      const botonMostrar = document.getElementById('btn-mostrar-panel');
      const botonOcultar = document.getElementById('btn-ocultar-panel');
      if (!panel || !botonMostrar) return;

      panel.style.display = 'none';
      botonMostrar.hidden = false;
      botonMostrar.setAttribute('aria-expanded', 'false');
      botonOcultar?.setAttribute('aria-expanded', 'false');
    }

    function mostrarPanel() {
      const panel = document.getElementById('header-card');
      const botonMostrar = document.getElementById('btn-mostrar-panel');
      const botonOcultar = document.getElementById('btn-ocultar-panel');
      if (!panel || !botonMostrar) return;

      panel.style.display = 'block';
      botonMostrar.hidden = true;
      botonMostrar.setAttribute('aria-expanded', 'true');
      botonOcultar?.setAttribute('aria-expanded', 'true');
    }

    function iniciarMapa(linea) {
      const codigo = String(linea || '').toUpperCase();
      const config = catalogoConcesiones[codigo];
      if (!config?.disponible && codigo !== 'T05') return;
      if (intervaloTimer) clearInterval(intervaloTimer);
      Object.values(marcadoresBuses).forEach(marcador => map?.removeLayer(marcador));
      marcadoresBuses = {};
      lineaActiva = codigo;
      configuracionConcesionActiva = config || { funciones: { paradas: true, horarios: true, tiempo_real: true } };
      inicializarHerramientas();
      document.getElementById('badge-linea-tag').innerText = codigo;
      document.getElementById('pantalla-inicio').style.display = 'none';
      mostrarPanel();

      initMap();
      primeraCarga = true;
      cargarCapasGTFS(codigo);
      if (configuracionConcesionActiva.funciones.tiempo_real) {
        document.getElementById('vehicle-title').innerText = 'Buscando autobuses...';
        document.getElementById('bus-info').innerText = 'Conectando con el servicio GTFS-RT...';
        actualizarEstadoConexion('connecting', 'CONECTANDO');
        actualizarBus();
        intervaloTimer = setInterval(actualizarBus, 5000);
      } else {
        actualizarEstadoConexion('empty', 'SIN TIEMPO REAL');
        document.getElementById('vehicle-title').innerText = 'Seguimiento en directo no disponible';
        document.getElementById('bus-info').innerText = 'Esta concesión no dispone de un feed GTFS-RT.';
        document.getElementById('last-updated').innerText = '—';
      }
    }

    function volverAlMenu() {
      if (intervaloTimer) clearInterval(intervaloTimer);
      if (intervaloLlegadasParada) clearInterval(intervaloLlegadasParada);
      intervaloLlegadasParada = null;
      lineaActiva = null;

      Object.keys(marcadoresBuses).forEach(id => {
        map.removeLayer(marcadoresBuses[id]);
      });
      marcadoresBuses = {};

      document.getElementById('header-card').style.display = 'none';
      document.getElementById('btn-mostrar-panel').hidden = true;
      document.getElementById('contenedor-filtros-lineas').hidden = true;
      document.getElementById('lista-filtros-lineas').innerHTML = '';
      configuracionConcesionActiva = null;
      document.getElementById('pantalla-inicio').style.display = 'flex';
    }

    function actualizarEstadoConexion(estado, texto) {
      const indicador = document.getElementById('live-status');
      const punto = document.getElementById('live-dot');
      const etiqueta = document.getElementById('live-status-text');
      if (!indicador || !punto || !etiqueta) return;
      etiqueta.innerText = texto;
      indicador.dataset.estado = estado;
      punto.style.backgroundColor = estado === 'online' ? '#22c55e' : (estado === 'offline' ? '#ef4444' : '#f59e0b');
      punto.style.animation = estado === 'online' ? 'pulse-green 2s infinite' : 'none';
    }

    async function actualizarBus() {
      if (!lineaActiva || solicitudEnCurso) return;

      const lineaSolicitada = lineaActiva;
      solicitudEnCurso = true;
      try {
        const respuesta = await fetch('/api/buses/' + lineaSolicitada.toLowerCase());
        if (!respuesta.ok) throw new Error(`HTTP ${respuesta.status}`);
        const datos = await respuesta.json();
        // Ignorar respuestas antiguas si el usuario ha cambiado de concesión.
        if (lineaActiva !== lineaSolicitada) return;

        if (Array.isArray(datos) && datos.length > 0) {
          actualizarEstadoConexion('online', 'EN VIVO');
          const idsVivos = new Set();
          const detallesCoches = [];
          const puntosLatLng = [];

          datos.forEach((bus) => {
            const lat = bus.lat;
            const lon = bus.lon;
            const coche = bus.coche || bus.id || "S/N";
            const matricula = bus.matricula || "";
            const idUnico = bus.id || coche;
            const ocupacion = bus.ocupacion || "Sin datos";
            const occColor = bus.ocupacion_color || "gray";
            const retraso = bus.retraso || "En hora";
            const proximaParada = bus.proxima_parada || "En trayecto";
            const destino = bus.destino || "En trayecto";

            idsVivos.add(idUnico);
            puntosLatLng.push([lat, lon]);
            detallesCoches.push(matricula ? `${coche} (${matricula})` : `${coche}`);

            const popupContent = `
              <div style="text-align: center; font-family: sans-serif; padding: 6px; min-width: 180px;">
                <b style="font-size: 1.1rem; color: #2563eb;">Línea ${escaparHTML(bus.linea || lineaSolicitada)}</b><br>
                <span style="font-size: 0.95rem; font-weight: bold; color: #1e293b;">Nº Coche: ${escaparHTML(coche)}</span><br>
                ${matricula ? `<span style="font-size: 0.8rem; color: #64748b;">Matrícula: ${escaparHTML(matricula)}</span><br>` : ''}
                
                <div style="margin: 8px 0; padding: 6px 8px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.78rem; text-align: left;">
                  <div style="margin-bottom: 3px;"><i class="fa-solid fa-route" style="color: #8b5cf6; width: 16px;"></i> <b>Destino:</b> ${escaparHTML(destino)}</div>
                  <div style="margin-bottom: 3px;"><i class="fa-solid fa-clock" style="color: #2563eb; width: 16px;"></i> <b>Estado:</b> ${escaparHTML(retraso)}</div>
                  <div><i class="fa-solid fa-location-dot" style="color: #ef4444; width: 16px;"></i> <b>Próxima:</b> ${escaparHTML(proximaParada)}</div>
                </div>

                <div class="occ-badge occ-${occColor}">
                  <i class="fa-solid fa-users" style="margin-right: 4px;"></i>${escaparHTML(ocupacion)}
                </div>
              </div>
            `;

            const lineaBus = bus.linea || lineaSolicitada;
            const iconoBus = obtenerIconoBus(lineaBus);
            if (marcadoresBuses[idUnico]) {
              marcadoresBuses[idUnico].setLatLng([lat, lon]);
              marcadoresBuses[idUnico].setIcon(iconoBus);
              marcadoresBuses[idUnico]._lineaBus = lineaBus;
              marcadoresBuses[idUnico].getPopup().setContent(popupContent);
            } else {
              marcadoresBuses[idUnico] = L.marker([lat, lon], { icon: iconoBus });
              marcadoresBuses[idUnico]._lineaBus = lineaBus;
              marcadoresBuses[idUnico].bindPopup(popupContent);
            }
          });

          aplicarFiltrosLineas();

          // Eliminar marcadores inactivos
          Object.keys(marcadoresBuses).forEach(id => {
            if (!idsVivos.has(id)) {
              map.removeLayer(marcadoresBuses[id]);
              delete marcadoresBuses[id];
            }
          });

          const ahora = new Date();
          document.getElementById('vehicle-title').innerText = `${datos.length} coche(s) en servicio`;
          document.getElementById('bus-info').innerText = detallesCoches.join(' | ');
          document.getElementById('last-updated').innerText = ahora.toLocaleTimeString();

          if (primeraCarga && puntosLatLng.length > 0) {
            if (puntosLatLng.length === 1) {
              map.setView(puntosLatLng[0], 15);
            } else {
              const bounds = L.latLngBounds(puntosLatLng);
              map.fitBounds(bounds, { padding: [50, 50] });
            }
            primeraCarga = false;
          }
        } else {
          actualizarEstadoConexion('empty', 'SIN VEHÍCULOS');
          // Si la API no devuelve vehículos, no dejar autobuses antiguos en el mapa.
          Object.keys(marcadoresBuses).forEach(id => {
            map.removeLayer(marcadoresBuses[id]);
            delete marcadoresBuses[id];
          });
          document.getElementById('vehicle-title').innerText = "Sin servicio";
          document.getElementById('bus-info').innerText = "Sin señal de bus";
        }
      } catch (error) {
        actualizarEstadoConexion('offline', 'SIN CONEXIÓN');
        console.error('Error cargando datos:', error);
        if (lineaActiva === lineaSolicitada) {
          document.getElementById('bus-info').innerText = "No se han podido actualizar los datos";
        }
      } finally {
        solicitudEnCurso = false;
      }
    }

    function centrarEnBus() {
      const marcadores = Object.values(marcadoresBuses).filter(marcador => map.hasLayer(marcador));
      if (marcadores.length === 1) {
        map.flyTo(marcadores[0].getLatLng(), 16, { duration: 1.2 });
      } else if (marcadores.length > 1) {
        const grupo = L.featureGroup(marcadores);
        map.flyToBounds(grupo.getBounds(), { padding: [60, 60], duration: 1.2 });
      }
    }
    cargarCatalogoConcesiones();
  </script>
</body>
</html>
