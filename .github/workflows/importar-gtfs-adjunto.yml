name: Importar GTFS actualizado de Aragón

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importar-gtfs-adjunto.yml"

permissions:
  contents: write

concurrency:
  group: importar-gtfs-aragon
  cancel-in-progress: false

jobs:
  importar:
    if: github.repository == 'danigar2205/mapa-tpa'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Mapa TPA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Obtener el GTFS oficial y comprobar que es el adjunto
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://gtfs-source-feeds.transit.land/es-nap-2554.zip" \
            --output /tmp/gtfs_aragon.zip
          ACTUAL="$(sha256sum /tmp/gtfs_aragon.zip | cut -d' ' -f1)"
          ESPERADO="c97c133955a0d48d3bd3a39c4ffc02cd9026591a9a9cbd22b65c74300d715b57"
          echo "SHA-256 descargado: $ACTUAL"
          if [ "$ACTUAL" != "$ESPERADO" ]; then
            echo "::error::La descarga pública no coincide exactamente con el ZIP adjunto. No se actualizarán datos."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import zipfile
          path = Path("/tmp/gtfs_aragon.zip")
          if path.stat().st_size != 16872848:
              raise SystemExit(f"Tamaño inesperado: {path.stat().st_size}")
          if not zipfile.is_zipfile(path):
              raise SystemExit("El archivo descargado no es un ZIP válido.")
          with zipfile.ZipFile(path) as archive:
              names = {name.rsplit("/", 1)[-1].lower() for name in archive.namelist()}
              required = {"agency.txt", "routes.txt", "stops.txt", "trips.txt", "stop_times.txt"}
              missing = required - names
              if missing:
                  raise SystemExit(f"Faltan archivos GTFS: {sorted(missing)}")
          print("ZIP idéntico al adjunto y estructura GTFS correcta.")
          PY

      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt

      - name: Importar todas las concesiones que contienen rutas
        run: python scripts/importar_gtfs_lote.py /tmp/gtfs_aragon.zip

      - name: Validar datos y mantener tiempo real solo en T05
        run: |
          python - <<'PY'
          from gtfs_datasets import cargar_datasets_gtfs

          codigos_nuevos = [
              "T01", "T02", "T04", "T05", "T07", "T08",
              "T09", "T10", "T12", "T13", "T14", "T15",
          ]
          datasets = cargar_datasets_gtfs("data")
          for codigo in codigos_nuevos:
              dataset = datasets[codigo]
              if not dataset["has_map"] or not dataset["map"]["routes"]:
                  raise SystemExit(f"{codigo}: mapa vacío o inválido.")
              if not dataset["has_schedules"] or not dataset["schedule"]["stop_times"]:
                  raise SystemExit(f"{codigo}: horarios vacíos o inválidos.")
              realtime = bool(dataset.get("has_realtime"))
              if (codigo == "T05") != realtime:
                  raise SystemExit(f"{codigo}: estado GTFS-RT inesperado ({realtime}).")
              print(
                  f"{codigo}: {len(dataset['map']['routes'])} rutas, "
                  f"{len(dataset['schedule']['stop_times'])} pasos horarios"
              )

          for codigo in ("T06", "T11"):
              dataset = datasets[codigo]
              if not dataset["has_map"] or not dataset["map"]["routes"]:
                  raise SystemExit(f"{codigo}: los datos anteriores no se han conservado.")
          print("Correcto: T06 y T11 conservadas; solo T05 tiene tiempo real.")
          PY

      - name: Guardar GTFS en main
        shell: bash
        run: |
          git add data/gtfs_t*_map.json.gz.b64 \
                  data/gtfs_t*_lookup.json.gz.b64 \
                  data/gtfs_t*_timetable.json.gz.b64
          if git diff --cached --quiet; then
            echo "No hay cambios GTFS que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza GTFS estático de Autobuses de Aragón"
          git push origin HEAD:main
