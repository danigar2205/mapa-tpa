name: Comprobar e importar el nuevo GTFS de Aragón

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/comprobar-importar-gtfs.yml"

permissions:
  contents: write

jobs:
  comprobar-e-importar:
    if: github.repository == 'danigar2205/mapa-tpa'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar el ZIP que se utilizó anteriormente
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown
          gdown "https://drive.google.com/uc?id=1tj91dYzwuKOZA19t95r0PBQoipG7ir6d" -O /tmp/gtfs_aragon_nap.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile

          ruta = Path("/tmp/gtfs_aragon_nap.zip")
          if not ruta.is_file() or not zipfile.is_zipfile(ruta):
              raise SystemExit("El enlace anterior no ha devuelto un ZIP válido.")
          digest = hashlib.sha256(ruta.read_bytes()).hexdigest()
          esperado = "c97c133955a0d48d3bd3a39c4ffc02cd9026591a9a9cbd22b65c74300d715b57"
          print(f"SHA-256 del ZIP de Drive: {digest}")
          if digest != esperado:
              raise SystemExit(
                  "El ZIP público de Drive NO es idéntico al adjunto de esta conversación. "
                  "No se ha modificado ningún dato GTFS del repositorio."
              )
          print("Coincide byte por byte con el ZIP adjunto: se puede importar.")
          PY

      - name: Importar todas las concesiones con rutas
        run: python scripts/importar_gtfs_lote.py /tmp/gtfs_aragon_nap.zip

      - name: Validar mapas, horarios y tiempo real
        run: |
          python - <<'PY'
          from gtfs_datasets import cargar_datasets_gtfs

          codigos = [
              "T01", "T02", "T04", "T05", "T07", "T08",
              "T09", "T10", "T12", "T13", "T14", "T15",
          ]
          datasets = cargar_datasets_gtfs("data")
          for codigo in codigos:
              dataset = datasets[codigo]
              if not dataset["has_map"] or not dataset["map"]["routes"]:
                  raise SystemExit(f"{codigo}: mapa GTFS vacío o inválido.")
              if not dataset["has_schedules"] or not dataset["schedule"]["stop_times"]:
                  raise SystemExit(f"{codigo}: horarios GTFS vacíos o inválidos.")
              if codigo == "T05" and not dataset["has_realtime"]:
                  raise SystemExit("T05 ha perdido la disponibilidad GTFS-RT.")
              if codigo != "T05" and dataset["has_realtime"]:
                  raise SystemExit(f"{codigo}: se ha activado GTFS-RT sin autorización.")
              print(
                  f"{codigo}: {len(dataset['map']['routes'])} rutas, "
                  f"{len(dataset['schedule']['stop_times'])} pasos horarios"
              )

          for codigo in ("T06", "T11"):
              if not datasets[codigo]["has_map"] or not datasets[codigo]["map"]["routes"]:
                  raise SystemExit(f"{codigo}: se han perdido los datos que debían conservarse.")
          print("Validación correcta: T05 sigue siendo la única concesión con tiempo real.")
          PY

      - name: Guardar los nuevos ficheros GTFS en main
        run: |
          git add data/gtfs_t*_map.json.gz.b64 \
                  data/gtfs_t*_lookup.json.gz.b64 \
                  data/gtfs_t*_timetable.json.gz.b64
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza GTFS estático de Autobuses de Aragón"
          git push origin HEAD:main
